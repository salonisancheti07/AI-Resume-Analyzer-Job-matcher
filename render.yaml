services:
  - type: web
    name: ai-resume-analyzer-api
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app-url.vercel.app
      - key: MONGO_URI
        value: mongodb://127.0.0.1:27017/ai-resume
      - key: OPENAI_API_KEY
        value: ""
